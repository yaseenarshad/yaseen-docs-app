# CI (YAZ-2131 🔒 D8): every pull request and every push to main gets a typecheck, the unit-test
# suite, a build and the size and integrity gate on it (`perf:budget:ci`, YAZ-2131 1B). The
# Playwright suite (`npm run e2e`) is local, not run here: it drives the app's real windows, so it
# runs only when Yasin asks (docs/DEVELOPMENT.md). Release packaging is release.yml.
#
# Split into jobs that run at the same time (one run was ~45 min on one Mac, ~40 of it `npm test`):
# - `unit-linux`: the `client` and `mobile` projects, in 4 shards on Linux, but for two files that need the Mac.
# - `mac-tests`: `desktop` and `tools` (codesign, FSEvents, DMG, updater…), on macOS.
# - `mac-build`: typecheck, build, phone build and the size gate, on macOS (the gate measures the Mac build), then the
#   timing budgets (`perf`, `perf-engine`), on the same Mac runner as before: the budgets were set on it.
# Only 5 macOS jobs run at once on the free plan, so a run uses 2 of them, no more.
# - `check`: passes only when all of them pass. It is the one status `main` requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request's branch cancels that branch's older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # The drawing engine's build (YAZ-3572 E4): its five dist/ folders and the stamp in them, keyed on every file
      # its build reads (`ENGINE_INPUTS` in tools/buildEngine.mjs). A hit makes `npm run engine:build` a no-op; a miss
      # builds it and saves it at the end of the job. One cache per OS (`runner.os`).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/packages/*/dist
          key: engine-${{ runner.os }}-${{ hashFiles('engine/package.json', 'engine/yarn.lock', 'engine/tsconfig.json', 'engine/.env.development', 'engine/.env.production', 'engine/scripts/**', 'engine/packages/tsconfig.base.json', 'engine/packages/utils/**', 'engine/packages/common/**', 'engine/packages/math/**', 'engine/packages/fractional-indexing/**', 'engine/packages/element/**', 'engine/packages/excalidraw/**') }}
      - run: npm ci
      # First after the install: draw.io's pack copies the engine's fonts, and the typecheck reads its types. A no-op after a cache hit.
      - run: npm run engine:build
      # Cache the verified draw.io pack (54 MB draw.war + unpacked/pruned tree) across CI jobs and runs (YAZ-6008 D12).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/.cache/drawio
          key: drawio-${{ runner.os }}-${{ hashFiles('shared/drawio.ts', 'tools/packDrawio.mjs', 'tools/lib/drawioPack.mjs', 'desktop/drawio-overlay/**') }}
      - run: npm run drawio:pack
      # The phone's layout tests drive headless Chrome (mobile/src/page/chromeLayout.testing.ts); the Linux runner's.
      # SKIP_MAC_ONLY leaves out two files that need the Mac (the `exclude` of client/ and mobile/vitest.config.ts);
      # `mac-tests` runs them (MAC_ONLY there): Monaco's keys are the Mac's (`codeKeys.test.ts`), and a 50 ms CPU limit
      # was set on the Mac runner (`waiting150.test.tsx`).
      - run: npm test -- --project client --project mobile --shard=${{ matrix.shard }}/4
        env:
          CHROME: /usr/bin/google-chrome
          SKIP_MAC_ONLY: '1'

  mac-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # The drawing engine's build (YAZ-3572 E4): its five dist/ folders and the stamp in them, keyed on every file
      # its build reads (`ENGINE_INPUTS` in tools/buildEngine.mjs). A hit makes `npm run engine:build` a no-op; a miss
      # builds it and saves it at the end of the job. One cache per OS (`runner.os`).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/packages/*/dist
          key: engine-${{ runner.os }}-${{ hashFiles('engine/package.json', 'engine/yarn.lock', 'engine/tsconfig.json', 'engine/.env.development', 'engine/.env.production', 'engine/scripts/**', 'engine/packages/tsconfig.base.json', 'engine/packages/utils/**', 'engine/packages/common/**', 'engine/packages/math/**', 'engine/packages/fractional-indexing/**', 'engine/packages/element/**', 'engine/packages/excalidraw/**') }}
      - run: npm ci
      # First after the install: draw.io's pack copies the engine's fonts, and the typecheck reads its types. A no-op after a cache hit.
      - run: npm run engine:build
      # Cache the verified draw.io pack (54 MB draw.war + unpacked/pruned tree) across CI jobs and runs (YAZ-6008 D12).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/.cache/drawio
          key: drawio-${{ runner.os }}-${{ hashFiles('shared/drawio.ts', 'tools/packDrawio.mjs', 'tools/lib/drawioPack.mjs', 'desktop/drawio-overlay/**') }}
      - run: npm run drawio:pack
      - run: npm test -- --project desktop --project tools
      # MAC_ONLY: the two client and phone files `unit-linux` leaves out (see there).
      - run: npx vitest run --project client --project mobile src/code/codeKeys.test.ts src/review/waiting150.test.tsx

  mac-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # The drawing engine's build (YAZ-3572 E4): its five dist/ folders and the stamp in them, keyed on every file
      # its build reads (`ENGINE_INPUTS` in tools/buildEngine.mjs). A hit makes `npm run engine:build` a no-op; a miss
      # builds it and saves it at the end of the job. One cache per OS (`runner.os`).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/packages/*/dist
          key: engine-${{ runner.os }}-${{ hashFiles('engine/package.json', 'engine/yarn.lock', 'engine/tsconfig.json', 'engine/.env.development', 'engine/.env.production', 'engine/scripts/**', 'engine/packages/tsconfig.base.json', 'engine/packages/utils/**', 'engine/packages/common/**', 'engine/packages/math/**', 'engine/packages/fractional-indexing/**', 'engine/packages/element/**', 'engine/packages/excalidraw/**') }}
      - run: npm ci
      # First after the install: draw.io's pack copies the engine's fonts, and the typecheck reads its types. A no-op after a cache hit.
      - run: npm run engine:build
      # Cache the verified draw.io pack (54 MB draw.war + unpacked/pruned tree) across CI jobs and runs (YAZ-6008 D12).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/.cache/drawio
          key: drawio-${{ runner.os }}-${{ hashFiles('shared/drawio.ts', 'tools/packDrawio.mjs', 'tools/lib/drawioPack.mjs', 'desktop/drawio-overlay/**') }}
      - run: npm run drawio:pack
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Monaco (the code tab, YAZ-3438) makes the renderer build need more heap than Node's default on
          # the hosted runner: without this the build dies with "JavaScript heap out of memory".
          NODE_OPTIONS: --max-old-space-size=6144
      # The phone web app (YAZ-5071): a plain Vite build of mobile/ into mobile/dist. It fails on any import of
      # Electron, Node, the desktop app or the drawing engine (mobile/importRules.ts).
      - run: npm run mobile:build
      # desktop/out against tools/perf/budget.json: renderer + main bytes, chunk closure, fonts, the CLI entry.
      # The packaged half (.app, DMG, Info.plist, seal) is `npm run perf:budget`, run locally after desktop:build.
      - run: npm run perf:budget:ci
      # The timing budgets (`perf`, then `perf-engine`; files one at a time), here rather than in `mac-tests` so the two
      # Mac jobs take about as long; after the build, on an idle runner, as their budgets need.
      - run: npm test -- --project perf --project perf-engine

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/packages/*/dist
          key: engine-${{ runner.os }}-${{ hashFiles('engine/package.json', 'engine/yarn.lock', 'engine/tsconfig.json', 'engine/.env.development', 'engine/.env.production', 'engine/scripts/**', 'engine/packages/tsconfig.base.json', 'engine/packages/utils/**', 'engine/packages/common/**', 'engine/packages/math/**', 'engine/packages/fractional-indexing/**', 'engine/packages/element/**', 'engine/packages/excalidraw/**') }}
      - run: npm ci
      - run: npm run engine:build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/.cache/drawio
          key: drawio-${{ runner.os }}-${{ hashFiles('shared/drawio.ts', 'tools/packDrawio.mjs', 'tools/lib/drawioPack.mjs', 'desktop/drawio-overlay/**') }}
      - run: npm run drawio:pack
      - name: Add swap for Monaco + electron-builder on 7 GB runner
        run: |
          sudo fallocate -l 4G /tmp/ci-swapfile
          sudo chmod 600 /tmp/ci-swapfile
          sudo mkswap /tmp/ci-swapfile
          sudo swapon /tmp/ci-swapfile
      - run: npm run desktop:build:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=5120
      - name: Smoke-test packaged Linux CLI (offline + xvfb cold-start)
        run: |
          set -euo pipefail
          TARBALL="$(ls desktop/dist-app/*-linux-*.tar.gz | head -n 1)"
          test -f "$TARBALL"
          TMP="$(mktemp -d)"
          trap 'pkill -f "$TMP/app/yaseen-docs" || true; rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/app" "$TMP/vault" "$TMP/profile"
          tar -xzf "$TARBALL" -C "$TMP/app" --strip-components=1
          CLI="$TMP/app/resources/bin/yaseendocs"
          test -x "$CLI"
          # 1. Offline CLI commands (plain Node via ELECTRON_RUN_AS_NODE)
          "$CLI" capabilities --json | grep -q '"app.status"'
          "$CLI" new "$TMP/vault" --title "Linux Smoke" --body "hello from linux"
          test -f "$TMP/vault/Linux Smoke.md"
          # 2. Cold-start live Electron + CLI automation under one Xvfb session
          YASEEN_DOCS_NO_SANDBOX=1 xvfb-run -a -s "-screen 0 1280x800x24" bash -euo pipefail -c '
            "$1" open --root "$2" --profile "$3" --wait-ms 25000
            STATUS="$("$1" app status --profile "$3" --json)"
            echo "$STATUS"
            echo "$STATUS" | jq -e '.ok == true and .value.running == true and .value.packaged == true' > /dev/null
          ' _ "$CLI" "$TMP/vault" "$TMP/profile"

  # The required status. `if: always()` so a failed or cancelled job above fails this one instead of skipping it.
  check:
    if: always()
    needs: [unit-linux, mac-tests, mac-build, linux-build]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "all CI jobs passed"
