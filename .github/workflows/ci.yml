# CI (YAZ-2131 🔒 D8): every pull request and every push to main gets a typecheck, the unit-test
# suite, a build and the size and integrity gate on it (`perf:budget:ci`, YAZ-2131 1B). The
# Playwright suite (`npm run e2e`) is local, not run here: it drives the app's real windows, so it
# runs only when Yasin asks (docs/DEVELOPMENT.md). Release packaging is release.yml.
#
# Split into jobs that run at the same time (one run was ~45 min on one Mac, ~40 of it `npm test`):
# - `unit-linux`: the `client` and `mobile` projects, in 4 shards on Linux (no Mac-only code in them).
# - `mac-tests`: `desktop` and `tools` (codesign, FSEvents, DMG, updater…) and the timing budgets (`perf`,
#   `perf-engine`), on macOS, as before: the budgets were set on this runner.
# - `mac-build`: typecheck, build, phone build and the size gate, on macOS: the gate measures the Mac build.
# - `check`: passes only when all of them pass. It is the one status `main` requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request's branch cancels that branch's older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The phone's layout tests drive headless Chrome (mobile/src/page/chromeLayout.testing.ts); the Linux runner's.
      - run: npm test -- --project client --project mobile --shard=${{ matrix.shard }}/4
        env:
          CHROME: /usr/bin/google-chrome

  mac-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm test -- --project desktop --project tools --project perf --project perf-engine

  mac-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run build
        env:
          # Monaco (the code tab, YAZ-3438) makes the renderer build need more heap than Node's default on
          # the hosted runner: without this the build dies with "JavaScript heap out of memory".
          NODE_OPTIONS: --max-old-space-size=6144
      # The phone web app (YAZ-5071): a plain Vite build of mobile/ into mobile/dist. It fails on any import of
      # Electron, Node, the desktop app or the drawing engine (mobile/importRules.ts).
      - run: npm run mobile:build
      # desktop/out against tools/perf/budget.json: renderer + main bytes, chunk closure, fonts, the CLI entry.
      # The packaged half (.app, DMG, Info.plist, seal) is `npm run perf:budget`, run locally after desktop:build.
      - run: npm run perf:budget:ci

  # The required status. `if: always()` so a failed or cancelled job above fails this one instead of skipping it.
  check:
    if: always()
    needs: [unit-linux, mac-tests, mac-build]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "all CI jobs passed"
