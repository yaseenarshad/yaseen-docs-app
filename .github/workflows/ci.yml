# CI (YAZ-2131 🔒 D8): every pull request and every push to main gets a typecheck, the unit-test
# suite, a build and the size and integrity gate on it (`perf:budget:ci`, YAZ-2131 1B). The
# Playwright suite (`npm run e2e`) is local, not run here: it drives the app's real windows, so its
# result is pasted into each PR instead. Release packaging is release.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # The drawing engine's build (YAZ-3572 E4): its five dist/ folders and the stamp in them, keyed on every file
      # its build reads (`ENGINE_INPUTS` in tools/buildEngine.mjs). A hit makes `npm run engine:build` a no-op; a miss
      # builds it (about a minute and a half) and saves it at the end of the job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/packages/*/dist
          key: engine-${{ runner.os }}-${{ hashFiles('engine/package.json', 'engine/yarn.lock', 'engine/scripts/**', 'engine/tsconfig.json', 'engine/packages/common/**', 'engine/packages/math/**', 'engine/packages/fractional-indexing/**', 'engine/packages/element/**', 'engine/packages/excalidraw/**') }}
      - run: npm ci
      # The pinned draw.io pack (YAZ-3028 D5, Draw's YAZ-1802 D5): sha256-checked, so the suites that read
      # the real bundle run here too, and `npm run build` finds it unpacked. Not cached: the 54 MB draw.war
      # downloads on each run (the repo allows actions/cache since YAZ-3572, for the engine only so far).
      - run: npm run drawio:pack
      # Before the typecheck, which reads the engine's types: a no-op after a cache hit.
      - run: npm run engine:build
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Monaco (the code tab, YAZ-3438) makes the renderer build need more heap than Node's default on
          # the hosted runner: without this the build dies with "JavaScript heap out of memory".
          NODE_OPTIONS: --max-old-space-size=6144
      # desktop/out against tools/perf/budget.json: renderer + main bytes, chunk closure, fonts, the CLI entry.
      # The packaged half (.app, DMG, Info.plist, seal) is `npm run perf:budget`, run locally after desktop:build.
      - run: npm run perf:budget:ci
