# The shared start of every CI job (ci.yml): Node 22 with npm's cache, the engine's build from its cache, `npm ci`,
# the engine and the pinned draw.io pack. Each job runs it after its own checkout.
name: setup
description: Node, npm ci, the engine build and the draw.io pack
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
    # The drawing engine's build (YAZ-3572 E4): its five dist/ folders and the stamp in them, keyed on every file
    # its build reads (`ENGINE_INPUTS` in tools/buildEngine.mjs). A hit makes `npm run engine:build` a no-op; a miss
    # builds it and saves it at the end of the job. One cache per OS (`runner.os`).
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: engine/packages/*/dist
        key: engine-${{ runner.os }}-${{ hashFiles('engine/package.json', 'engine/yarn.lock', 'engine/tsconfig.json', 'engine/.env.development', 'engine/.env.production', 'engine/scripts/**', 'engine/packages/tsconfig.base.json', 'engine/packages/utils/**', 'engine/packages/common/**', 'engine/packages/math/**', 'engine/packages/fractional-indexing/**', 'engine/packages/element/**', 'engine/packages/excalidraw/**') }}
    - run: npm ci
      shell: bash
    # First after the install: draw.io's pack copies the engine's fonts, and the typecheck reads its types. A no-op after a cache hit.
    - run: npm run engine:build
      shell: bash
    # The pinned draw.io pack (YAZ-3028 D5, Draw's YAZ-1802 D5): sha256-checked, so the suites that read
    # the real bundle run here too, and `npm run build` finds it unpacked. Not cached: the 54 MB draw.war
    # downloads on each run.
    - run: npm run drawio:pack
      shell: bash
